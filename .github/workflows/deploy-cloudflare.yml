name: Validate and Deploy Cloudflare Worker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  NODE_VERSION: "22.x"

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Build production output
        run: npm run build:cloudflare

      - name: Validate production artifact
        run: |
          test -f dist/index.html
          grep -Fq "When the building fails" dist/index.html
          test -f dist/intake/index.html
          test -f worker.js
          test -f wrangler.live.jsonc
          grep -Fq '"name": "alliance-main-site"' wrangler.live.jsonc
          echo "Production artifact and Worker configuration validated."

      - name: Validate Wrangler configuration
        run: npx wrangler@latest deploy --config wrangler.live.jsonc --dry-run

      - name: Detect Cloudflare CI credentials
        id: cloudflare-auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare CI credentials are configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deploy skipped because GitHub CI credentials are not configured. Validation still passed."
          fi

      - name: Deploy production Worker
        if: steps.cloudflare-auth.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest deploy --config wrangler.live.jsonc
