name: Validate and Deploy Cloudflare Worker

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      confirm_live_worker_target:
        description: "ONLY after verifying alliance-main-site is the live origin. Type YES to deploy."
        required: true
        default: "NO"
        type: choice
        options:
          - "NO"
          - "YES"

env:
  NODE_VERSION: "22.x"

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned checkout v4.2.2 (tested)

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Build production output
        run: npm run build:cloudflare

      - name: Validate production artifact
        run: |
          test -f dist/index.html
          grep -Fq "Asbestos, roofing &amp;" dist/index.html
          test -s dist/_worker.js
          test -f dist/intake/index.html
          test -f worker.js
          test -f wrangler.live.jsonc
          grep -Fq '"name": "alliance-main-site"' wrangler.live.jsonc
          echo "Production artifact and Worker configuration validated."

      - name: Validate Wrangler configuration
        run: npx wrangler@latest deploy --config wrangler.live.jsonc --dry-run

      - name: Detect Cloudflare CI credentials
        id: cloudflare-auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare CI credentials are configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deploy skipped because GitHub CI credentials are not configured. Validation still passed."
          fi

      - name: Reject manual release without credentials
        if: github.event_name == 'workflow_dispatch' && inputs.confirm_live_worker_target == 'YES' && steps.cloudflare-auth.outputs.ready != 'true'
        run: |
          echo "::error::Missing CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID. No production deployment attempted."
          exit 1

      # Never deploy merely because a PR merged; the configured Worker owns both public hostnames.
      # First verify it is the intended origin and preserve its existing deployment for rollback.
      - name: Deploy production Worker
        if: github.event_name == 'workflow_dispatch' && inputs.confirm_live_worker_target == 'YES' && steps.cloudflare-auth.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest deploy --config wrangler.live.jsonc
