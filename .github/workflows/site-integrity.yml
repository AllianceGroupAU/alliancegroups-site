name: Site integrity
on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check worker.js
          node --check js/form-handler.js
          node --check js/intake-final.js
          node --check js/final-home.js
      - name: Run intake and content regression tests
        run: npm test
      - name: Build Cloudflare Pages package
        run: npm run build:cloudflare
      - name: Verify deployment bundle
        run: |
          test -s dist/index.html
          test -s dist/_worker.js
          test -s dist/intake/index.html
          test -s dist/sitemap.xml
          test -s dist/robots.txt
          grep -q 'url.pathname === "/api/intake"' dist/_worker.js
